<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#581c87" />
    <title>LexBot Admin</title>
    <style>
      /* Evitar flash de contenido sin estilo */
      html, body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom right, #581c87, #1e3a8a, #312e81);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      #root {
        min-height: 100vh;
        background: transparent;
      }
      
      /* Loading inicial */
      .initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom right, #581c87, #1e3a8a, #312e81);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading inicial para evitar parpadeo -->
      <div class="initial-loading">
        <div style="
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(12px);
          border-radius: 16px;
          padding: 32px;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
          border: 1px solid rgba(255, 255, 255, 0.1);
        ">
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="
              width: 32px;
              height: 32px;
              border: 2px solid transparent;
              border-top: 2px solid #06b6d4;
              border-radius: 50%;
              animation: spin 1s linear infinite;
            "></div>
            <p style="color: white; font-size: 18px; margin: 0;">Cargando...</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
